<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Tom · El Cruce"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Tom · El Cruce 2026 — v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0a;--surface:#1a1a1a;--surface2:#222;--ink:#f2f2f7;--muted:#6b6b6b;--border:#2a2a2a;
  --b1:#60a5fa;--b2:#4ade80;--b3:#fbbf24;--b4:#c084fc;--b5:#f87171;
  --run:#38bdf8;--qual:#f87171;--lng:#fbbf24;--swm:#22d3ee;--hike:#a3e635;
  --gleg:#a78bfa;--gup:#c084fc;--mob:#34d399;--b2b:#fb923c;--rst:#6b6b6b;--prot:#f472b6;--bike:#818cf8;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:'JetBrains Mono','SF Mono','Menlo',monospace;
  --r:10px;--r2:14px;--nav-h:52px;--bot-h:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;background:#0a0a0a;-webkit-text-size-adjust:100%;}
body{font-family:var(--font);background:#0a0a0a;color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior:none;}

.top-nav{position:fixed;top:0;left:0;right:0;z-index:200;background:#0a0a0a;display:flex;align-items:flex-end;padding:0 16px 12px;padding-top:max(12px, env(safe-area-inset-top));gap:12px;border-bottom:1px solid #2a2a2a;min-height:calc(var(--nav-h) + env(safe-area-inset-top,0px));}
.app-title{font-family:var(--mono);font-size:12px;font-weight:500;color:#fff;letter-spacing:.08em;flex:1;}
.week-ctrl{display:flex;align-items:center;gap:6px;}
.wc-btn{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.wc-btn:active{background:rgba(255,255,255,.2);}
.wc-label{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.6);min-width:44px;text-align:center;}

.bot-nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #2a2a2a;z-index:200;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);}
.bn-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 2px;border:none;background:none;cursor:pointer;color:#555;transition:color .15s;}
.bn-tab.active{color:var(--b2);}
.bn-tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.bn-label{font-size:9px;font-weight:500;}
.bn-tab:focus-visible{outline:2px solid var(--b2);outline-offset:-2px;}

.page{display:none;padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(var(--bot-h) + env(safe-area-inset-bottom,0px) + 12px);min-height:100dvh;-webkit-overflow-scrolling:touch;overflow-y:auto;}
.page.active{display:block;}
.pg-inner{padding:0 14px;}

.today-hero{background:#0f0f0f;border-bottom:1px solid var(--border);padding:20px 16px 24px;margin-bottom:16px;}
.th-phase{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.th-week{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:4px;}
.th-date{font-size:13px;color:var(--muted);margin-bottom:16px;}
.th-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.th-stat{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:10px;}
.th-stat-val{font-size:20px;font-weight:700;line-height:1;}
.th-stat-label{font-size:10px;color:var(--muted);margin-top:2px;}

.today-focus{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;margin-bottom:14px;}
.tf-label{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.tf-text{font-size:13px;line-height:1.7;}

.today-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;}
.td-day{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 3px;}
.td-day.is-today{border-color:var(--b2);border-width:2px;}
.td-name{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);text-align:center;margin-bottom:4px;}
.td-sessions{display:flex;flex-direction:column;gap:2px;}

.today-detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:14px;overflow:hidden;}
.tdet-head{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface2);}
.tdet-day{font-weight:700;font-size:14px;}
.tdet-body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;}

.stag{border-radius:5px;padding:5px 7px;font-size:11px;font-weight:600;line-height:1.3;border-left:2px solid currentColor;background:rgba(255,255,255,.04);}
.stag-sm{border-radius:3px;padding:2px 4px;font-size:10px;font-weight:600;line-height:1.2;display:block;border-left:2px solid currentColor;background:rgba(255,255,255,.04);}
.stag-dur{font-size:10px;font-weight:400;opacity:.6;display:block;margin-top:1px;}
.stag.done,.stag-sm.done{opacity:.42;}
.stag.done .stag-dur{opacity:.5;}
.done-tick{font-weight:700;margin-right:3px;}
.mob-tag{color:var(--mob);border-radius:3px;font-size:10px;font-weight:600;padding:2px 5px;display:inline-block;margin-top:2px;border-left:2px solid var(--mob);background:rgba(255,255,255,.04);}
.s-easy{color:var(--run);}
.s-quality{color:var(--qual);}
.s-long{color:var(--lng);}
.s-swim{color:var(--swm);}
.s-hike{color:var(--hike);}
.s-gym-leg{color:var(--gleg);}
.s-gym-up{color:var(--gup);}
.s-mob{color:var(--mob);}
.s-rest{color:var(--rst);}
.s-race{color:var(--b2);}
.s-b2b{color:var(--b2b);}
.s-bike{color:var(--bike);}
.s-prot{color:var(--prot);}

.phase-hdr{padding:18px 14px 10px;}
.ph-pill{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 10px;border-radius:100px;margin-bottom:6px;}
.ph-name{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;}
.ph-desc{font-size:12px;color:var(--muted);line-height:1.6;}

.week-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin:0 14px 10px;}
.week-card.is-cur{border-color:var(--b2);border-width:2px;}
.wk-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);}
.wk-num{font-family:var(--mono);font-size:18px;font-weight:600;min-width:34px;}
.wk-info{flex:1;min-width:0;}
.wk-label{font-weight:700;font-size:13px;}
.wk-date{font-family:var(--mono);font-size:10px;color:var(--muted);}
.wk-km{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap;}
.wk-badge{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;white-space:nowrap;}
.wk-days{display:grid;grid-template-columns:repeat(7,1fr);}
.day-col{border-right:1px solid var(--border);}
.day-col:last-child{border-right:none;}
.day-col.is-today{background:rgba(74,222,128,.06);}
.dc-name{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);padding:5px 5px 3px;border-bottom:1px solid var(--border);}
.dc-sess{padding:4px 3px;display:flex;flex-direction:column;gap:2px;min-height:72px;}
.wk-focus{padding:8px 14px;background:var(--surface2);border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.5;}

.wk-tab-section{padding:0 14px 16px;}
.section-hdr{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;padding-top:20px;}
.section-sub{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
.prog-note{background:var(--surface2);border-radius:var(--r);padding:11px 14px;font-size:12px;color:var(--muted);margin-bottom:14px;border-left:3px solid var(--border);}
.phase-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.ph-btn{font-family:var(--mono);font-size:10px;font-weight:500;padding:6px 13px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;}
.ph-btn.active{background:#f2f2f7;color:#111;border-color:#f2f2f7;}
.workout-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
.wc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;}
.wc-head{padding:12px 14px;border-bottom:1px solid var(--border);}
.wc-name{font-weight:700;font-size:14px;margin-bottom:2px;}
.wc-meta{font-family:var(--mono);font-size:10px;color:var(--muted);}
.ex-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;}
.ex-row:last-child{border-bottom:none;}
.ex-info{flex:1;min-width:0;}
.ex-name{font-weight:500;}
.ex-note{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5;}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;}
.chip-sets{background:rgba(56,189,248,.1);color:var(--run);border:1px solid rgba(56,189,248,.3);}
.chip-rpe{background:rgba(251,191,36,.1);color:var(--lng);border:1px solid rgba(251,191,36,.3);}

.run-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:12px;}
.run-head{padding:12px 14px;border-bottom:1px solid var(--border);}
.run-name{font-weight:700;font-size:14px;margin-bottom:2px;}
.run-meta{font-family:var(--mono);font-size:10px;color:var(--muted);}
.run-row{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:8px;align-items:flex-start;}
.run-row:last-child{border-bottom:none;}
.run-label{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);min-width:62px;flex-shrink:0;padding-top:1px;}
.run-detail{flex:1;line-height:1.6;}

.mob-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.mob-zone{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;}
.mob-zone-title{font-weight:600;font-size:12px;margin-bottom:6px;}
.mob-ex{font-size:11px;color:var(--muted);padding:3px 0;border-bottom:1px solid var(--border);line-height:1.4;}
.mob-ex:last-child{border-bottom:none;}
@media(max-width:560px){.mob-grid{grid-template-columns:1fr;}}

.missed-section{padding:0 14px;}
.miss-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:10px;}
.miss-head{padding:11px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;}
.miss-body{padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.7;}
.miss-body strong{color:var(--ink);}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.quick-item{background:var(--surface2);border-radius:var(--r);padding:10px 12px;font-size:12px;line-height:1.6;}
.quick-item strong{color:var(--ink);display:block;margin-bottom:2px;}

.note{border-left:2px solid var(--swm);border-radius:var(--r);padding:11px 14px;font-size:12px;color:var(--swm);margin-bottom:10px;line-height:1.6;background:rgba(34,211,238,.05);}
.note-gate{border-left-color:var(--prot);color:var(--prot);background:rgba(244,114,182,.06);}
.note-warn{border-left-color:var(--qual);color:var(--qual);background:rgba(248,113,113,.05);}
.note strong{color:inherit;}

.countdown{display:flex;gap:8px;margin:0 14px 14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);align-items:center;}
.cd-unit{text-align:center;flex:1;}
.cd-val{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;color:var(--b4);}
.cd-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
.cd-sep{font-family:var(--mono);font-size:18px;color:var(--border);padding-bottom:10px;}

.milestone{margin:0 0 14px;padding:14px 16px;border-radius:var(--r2);border:1px solid;font-size:13px;line-height:1.7;}

.legend{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-top:1px solid var(--border);margin-top:8px;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.prot-hero{padding:18px 14px 8px;}
.prot-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;}
.prot-sub{font-size:13px;color:var(--muted);line-height:1.6;}
.prot-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin:0 14px 12px;}
.prot-head{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:8px;}
.prot-head-name{font-weight:700;font-size:14px;flex:1;}
.prot-freq{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:100px;}
.pex{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
.pex:last-child{border-bottom:none;}
.pex-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--prot);min-width:16px;padding-top:2px;}
.pex-info{flex:1;min-width:0;}
.pex-name{font-weight:600;font-size:13px;}
.pex-cue{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
.pex-dose{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;background:rgba(244,114,182,.1);color:var(--prot);border:1px solid rgba(244,114,182,.3);}
</style>
</head>
<body>

<div class="top-nav">
  <div class="app-title">TOM · EL CRUCE 2026</div>
  <div class="week-ctrl">
    <button class="wc-btn" onclick="changeWeek(-1)" aria-label="Semana anterior">‹</button>
    <span class="wc-label" id="wkLabel">Sem 1</span>
    <button class="wc-btn" onclick="changeWeek(1)" aria-label="Semana siguiente">›</button>
  </div>
</div>

<div class="page active" id="pg-today"></div>
<div class="page" id="pg-plan"></div>
<div class="page" id="pg-workouts"></div>
<div class="page" id="pg-protocol"></div>
<div class="page" id="pg-missed"></div>

<nav class="bot-nav" aria-label="Navegación principal">
  <button class="bn-tab active" id="tab-today" onclick="showPage('today')" aria-label="Hoy">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span class="bn-label">Hoy</span>
  </button>
  <button class="bn-tab" id="tab-plan" onclick="showPage('plan')" aria-label="Plan completo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    <span class="bn-label">Plan</span>
  </button>
  <button class="bn-tab" id="tab-workouts" onclick="showPage('workouts')" aria-label="Sesiones">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5h11M6.5 12h11M6.5 17.5h11"/><circle cx="4" cy="6.5" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="17.5" r="1"/></svg>
    <span class="bn-label">Sesiones</span>
  </button>
  <button class="bn-tab" id="tab-protocol" onclick="showPage('protocol')" aria-label="Protocolo peroneo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"/></svg>
    <span class="bn-label">Protocolo</span>
  </button>
  <button class="bn-tab" id="tab-missed" onclick="showPage('missed')" aria-label="Sesión perdida">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span class="bn-label">Perdí?</span>
  </button>
</nav>

<script>
// ═══════════════════════════════════════════════
// TOM · EL CRUCE 2026 — PLAN v5
// Reconstruido 25 Ago 2026 desde estado real.
//
// PUNTO DE PARTIDA: long run 9,3 km (22 Ago) · cadencia 88-91
// · escalera de retorno completa, 6/6 mañanas limpias.
//
// ZONAS
//   Fácil / Z2 ....... HR 140-150
//   Tempo / calidad .. HR 157-170 (techo duro 172)
//   Powerhike ........ HR 130-145
//   Bici Z2 .......... HR 130-145 (corre 5-10 bpm bajo el running)
//   Cadencia objetivo. 88-90 (ya alcanzado: 88,5 fácil / 91-92 reps)
//
// MÉTRICA DE GOBIERNO: rigidez matinal en peroneos.
//   Igual o menor que ayer → dosis correcta, seguís.
//   Peor que ayer → la sesión previa se pasó, bajás.
//   La sensación DURANTE la sesión no decide nada.
//
// FUERA DEL PLAN: maratón (gate falló) · HM (no corrida).
// ═══════════════════════════════════════════════

const START = new Date('2026-08-24T00:00:00');
const RACE_DATE = new Date('2026-12-08T00:00:00');
const DAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const TOTAL_WEEKS = 16;

// ─── BLOQUES ─────────────────────────────────
const PI = {
  1:{n:'Consolidación',c:'var(--b1)',l:'rgba(96,165,250,.15)',wks:'Sem 1–3',
     desc:'Cerrar la escalera de retorno con margen real, no al límite. Cuatro días de carrera (mar calidad · mié fácil corto · jue fácil · sáb long) — el miércoles es nuevo y ocupa desde ya el lugar que en el Bloque 2 pasa a ser descenso. Long run 15 → 16 → 18 km. Una calidad por semana con techo de HR de verdad (157–170, nunca arriba de 172). Powerhike semanal 75–90 min, sumando mochila liviana desde la Sem 2. El trabajo excéntrico de descenso arranca en el gimnasio — es la fase que tiene que preceder a cualquier bajada en terreno. Protocolo peroneo diario, sin excepción.'},
  2:{n:'Construcción',c:'var(--b2)',l:'rgba(74,222,128,.15)',wks:'Sem 4–8',
     desc:'Volumen y especificidad de montaña en paralelo. Long run 19 → 21 → 23 → (17 baja) → 26 km. Segunda calidad semanal desde la Sem 5. Primera bajada en terreno real en Sem 4. B2B desde Sem 6: el domingo es mixto hike/run al 60 % del sábado, nunca corrida completa. Ensayo de recarga inter-etapa en los B2B. Técnica de bastones desde Sem 6 si los llevás.'},
  3:{n:'Pico',c:'var(--b3)',l:'rgba(251,191,36,.15)',wks:'Sem 9–12',
     desc:'La sesión pico no es un long run de récord — es una salida de 5–6 h mixta run/hike con desnivel, mochila y nutrición completa. Las etapas reales son 32 km / 1.200 m D+, 30 km / 1.600 m D+ y 32 km / 1.600 m D+ (~4,5–6,5 h cada una): lo que las define es la pendiente — la E2 sube ~1.000 m en ~6,5 km y baja ~700 m en ~3,5 km al 19 % — y un largo plano no se le parece. Semana de baja en el medio del bloque (Sem 10), no al final. Sem 11 incluye el ensayo de dos días consecutivos, con el primer día deliberadamente el más suave. Sem 12 repite el vertical sobre piernas descansadas: ~100 min continuos en cinta al 12 % y bajadas corridas, que es lo más parecido a la subida y la bajada de la E2.'},

let curWk = 1;
let scBlock = 1;

const WEEK_STARTS = (() => {
  const arr = [];
  for(let i = 0; i < TOTAL_WEEKS; i++){
    const d = new Date(START);
    d.setDate(START.getDate() + i*7);
    arr.push(d.getTime());
  }
  return arr;
})();

function getAutoWeek(){
  const now = Date.now();
  if(now < WEEK_STARTS[0]) return 1;
  for(let i = WEEK_STARTS.length - 1; i >= 0; i--){
    if(now >= WEEK_STARTS[i]) return i + 1;
  }
  return 1;
}
function getDayIdx(){const d = new Date().getDay();return d===0?6:d-1;}

function blockColor(ph){return ['','var(--b1)','var(--b2)','var(--b3)','var(--b4)','var(--b5)'][ph];}

function sessHTML(sess,small){
  if(!sess) return '';
  if(sess.t==='mob') return `<span class="mob-tag">${sess.n} ${sess.d}</span>`;
  const cls=TC[sess.t]||'s-rest';
  const dc=sess.dn?' done':'';
  const tick=sess.dn?'<span class="done-tick">✓</span>':'';
  if(small) return `<span class="stag-sm ${cls}${dc}">${tick}${sess.n}</span>`;
  return `<div class="stag ${cls}${dc}">${tick}${sess.n}${sess.d?`<span class="stag-dur">${sess.d}</span>`:''}</div>`;
}
function badgeStyle(b){
  if(b==='RACE') return 'background:rgba(74,222,128,.15);color:var(--b2);border:1px solid rgba(74,222,128,.3)';
  if(b==='KEY') return 'background:rgba(96,165,250,.15);color:var(--b1);border:1px solid rgba(96,165,250,.3)';
  if(b==='DOWN') return 'background:rgba(52,211,153,.15);color:var(--mob);border:1px solid rgba(52,211,153,.3)';
  return '';
}

// ─── CUENTA REGRESIVA ────────────────────────
function updateCountdown(){
  const el = document.getElementById('countdown');
  if(!el) return;
  const diff = RACE_DATE - Date.now();
  if(diff <= 0){el.innerHTML='<div class="cd-unit"><div class="cd-val" style="color:var(--b2)">🏁</div><div class="cd-label">Día de carrera</div></div>';return;}
  const d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000),
        m=Math.floor(diff%3600000/60000), sec=Math.floor(diff%60000/1000);
  el.innerHTML=`<div class="cd-unit"><div class="cd-val">${d}</div><div class="cd-label">días</div></div>
    <div class="cd-sep">:</div><div class="cd-unit"><div class="cd-val">${String(h).padStart(2,'0')}</div><div class="cd-label">hs</div></div>
    <div class="cd-sep">:</div><div class="cd-unit"><div class="cd-val">${String(m).padStart(2,'0')}</div><div class="cd-label">min</div></div>
    <div class="cd-sep">:</div><div class="cd-unit"><div class="cd-val">${String(sec).padStart(2,'0')}</div><div class="cd-label">seg</div></div>`;
}
setInterval(updateCountdown, 1000);

  8: {color:'var(--b2)', title:'Check-in · Sem 8', body:'Pico de distancia (26 km) + cinta ondulante. Pasale: cómo se sintió el domingo sobre piernas cansadas, si la recarga de carbos funcionó, y cualquier señal del tendón. Define la estructura del bloque de pico.'},
  11:{color:'var(--b3)', title:'Check-in · Sem 11', body:'Ensayo de dos días. Pasale: horas totales de cada día, desnivel, si el sábado fue realmente el día más fácil, y cómo estuviste el domingo a la mañana. Es el mejor predictor de El Cruce que vas a tener.'},
  16:{color:'var(--b5)', title:'Check-in · Post-carrera', body:'El Cruce terminado. Pasale: cómo se sintió cada etapa, ejecución de nutrición e hidratación, señales de lesión, y qué te sorprendió. De ahí sale el plan 2027.'},

function milestoneHTML(wk){
  const m = MILESTONES[wk];
  if(!m) return '';
  return `<div class="milestone" style="border-color:${m.color};background:${m.color}18;color:var(--ink)">
    <strong style="color:${m.color}">${m.title}</strong><br>${m.body}</div>`;
}

      <div class="th-stats">

        <div class="th-stat"><div class="th-stat-val" style="color:${bc}">${curWk}<span style="font-size:14px;opacity:.7">/${TOTAL_WEEKS}</span></div><div class="th-stat-label">semana</div></div>
        <div class="th-stat"><div class="th-stat-val" style="font-size:14px;color:${bc}">${bl.n}</div><div class="th-stat-label">${bl.wks}</div></div>
      </div>

    <div class="pg-inner">
      <div class="today-days">${miniDays}</div>
      <div class="today-detail">
        <div class="tdet-head"><div class="tdet-day">Hoy · ${DAYS[tod]}</div></div>
        <div class="tdet-body">${todDetail}</div>
      </div>
    </div>
    <div id="countdown" class="countdown"></div>
    <div class="pg-inner">
      ${milestoneHTML(curWk)}
      <div class="today-focus">
        <div class="tf-label">Foco de la semana</div>
        <div class="tf-text">${wk.focus}</div>
      </div>
      <div class="note note-gate">
        🦶 <strong>Rigidez matinal — la métrica que manda.</strong> Chequealo antes de levantarte de la cama, todos los días. Igual o menor que ayer → la dosis fue correcta, seguís. Peor que ayer → la sesión de ayer se pasó, bajás un escalón. Lo que sentís DURANTE la sesión no decide nada: el tendón responde con 24 h de retraso.
      </div>
      <div class="note">
        💧 <strong>Natación · pausada hasta post-Cruce.</strong> Foco total en running + gimnasio hasta diciembre. <strong>Gimnasio inverso al running:</strong> 3× en semanas de poco running (7 y 10), 2× en semanas de mucho running (8, 9, 11, 12). En el taper (13–16) el gimnasio baja junto con el running — no se invierte. Un día = una sesión.</div>
      <div class="note" style="border-left-color:var(--bike);color:var(--bike);background:rgba(129,140,248,.06)">
        🚲 <strong>Bici en casa · dosis.</strong> Z2 en bici = <strong>HR 130–145</strong> (5–10 bpm bajo la zona corriendo). <strong>90 min</strong> = respaldo del domingo cuando el hike no va a pasar. <strong>2–3 h</strong> = bloque aeróbico real, válido cuando es la sesión principal del día. <strong>4–5 h</strong> = estímulo grande y legítimo, pero máximo 1 vez cada 3–4 semanas y solo si no compromete las 48 h siguientes. Arriba de 2 h necesitás combustible de verdad: 60–90 g de carbos por hora, o el estímulo se convierte en agujero.
      </div>

// ─── PLAN COMPLETO ───────────────────────────
function renderPlan(){
  let html = '';
  let lastPh = -1;
  W.forEach(wk=>{
    if(wk.ph!==lastPh){
      const bl=blockOf(wk.ph);
      const bc=blockColor(wk.ph);
      html+=`<div class="phase-hdr">
        <div class="ph-pill" style="background:${bl.l};color:${bc};border:1px solid ${bc}22">${bl.wks}</div>
        <div class="ph-name" style="color:${bc}">${bl.n}</div>
        <div class="ph-desc">${bl.desc}</div>
      </div>`;
      lastPh=wk.ph;
    }
    const isCur=wk.wk===curWk;
    const bc=blockColor(wk.ph);
    const badge=wk.badge?`<span class="wk-badge" style="${badgeStyle(wk.badge)}">${wk.badge}</span>`:'';
    const todIdx=getDayIdx();
    const dayCols=DAYS.map((d,i)=>{
      const ds=wk.days[i]||[];
      const isT=isCur&&i===todIdx;
      return `<div class="day-col${isT?' is-today':''}">
        <div class="dc-name"${isT?' style="color:var(--b2);font-weight:700"':''}>${d}</div>
        <div class="dc-sess">${ds.map(x=>sessHTML(x,false)).join('')}</div>
      </div>`;
    }).join('');
    html+=`<div class="week-card${isCur?' is-cur':''}" id="wk-${wk.wk}">
      <div class="wk-top">
        <span class="wk-num" style="color:${bc}">S${wk.wk}</span>
        <div class="wk-info">
          <div class="wk-label">${wk.label}${isCur?' ← ahora':''}</div>
          <div class="wk-date">${wk.date}</div>
        </div>
        ${badge}
        <span class="wk-km" style="color:${bc}">${wk.km} km</span>
      </div>
      <div class="wk-days">${dayCols}</div>
      <div class="wk-focus">${wk.focus}</div>
    </div>`;
  });
  html+=legendHTML();
  document.getElementById('pg-plan').innerHTML=html;
  setTimeout(()=>{
    const el=document.getElementById(`wk-${curWk}`);
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  },100);
}

      </div>${rows}</div>`;
  }

  const descHTML = DESC.map(d=>`
    <div class="wc-card">
      <div class="wc-head" style="border-left:3px solid ${d.c}">
        <div class="wc-name" style="color:${d.c}">${d.f}</div>
        <div class="wc-meta">${d.w}</div>
      </div>
      <div class="run-row"><span class="run-detail" style="color:var(--muted);font-size:12px">${d.d}</span></div>

  const gymSection=sc&&sc.gymA?`

    :(sc?`<div class="section-hdr" style="color:${bc}">Fuerza</div><div class="section-sub">${sc.sub}</div>`:'');

  const runSection=rw?`
    <div class="section-hdr" style="color:${bc}">Sesiones de carrera</div>
    <div class="section-sub">${rw.sub}</div>
    <div class="workout-cards">${rw.sessions.map(runCard).join('')}</div>`:'';

  const descSection=`

    <div class="note note-gate" style="margin:0 14px 14px">

    </div>
    <div class="prot-card">

      ${pexList(PROT_DAILY,1)}

    <div class="prot-card">
      <div class="prot-head"><span class="prot-head-name">3× por semana · días de gym</span><span class="prot-freq" style="background:rgba(244,114,182,.15);color:var(--prot)">+8 min</span></div>

// ─── LEYENDA ─────────────────────────────────

  const items=[
    {c:'var(--qual)',l:'Calidad'},{c:'var(--lng)',l:'Long run'},{c:'var(--run)',l:'Fácil'},
    {c:'var(--hike)',l:'Powerhike'},{c:'var(--b2b)',l:'B2B'},{c:'var(--bike)',l:'Bici'},{c:'var(--swm)',l:'Natación'},
    {c:'var(--gleg)',l:'Full Body A/B'},{c:'var(--gup)',l:'Full Body C'},
    {c:'var(--prot)',l:'Protocolo'},{c:'var(--mob)',l:'Movilidad'},{c:'var(--rst)',l:'Descanso'},
  ];
  return `<div class="legend">${items.map(i=>`<div class="leg"><div class="leg-dot" style="background:${i.c}"></div>${i.l}</div>`).join('')}</div>`;
}

// ─── NAVEGACIÓN ──────────────────────────────
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.bn-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('pg-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(name==='today') renderToday();
  else if(name==='plan') renderPlan();
  else if(name==='workouts') renderWorkouts();
  else if(name==='protocol') renderProtocol();
  else if(name==='missed') renderMissed();
}
function changeWeek(d){
  curWk=Math.min(Math.max(curWk+d,1),TOTAL_WEEKS);
  document.getElementById('wkLabel').textContent='Sem '+curWk;
  const active=document.querySelector('.page.active').id.replace('pg-','');
  if(active==='today') renderToday();
  else if(active==='plan') renderPlan();
}

// ─── INIT ────────────────────────────────────
curWk=getAutoWeek();
document.getElementById('wkLabel').textContent='Sem '+curWk;
renderToday();
renderWorkouts();
renderProtocol();
renderMissed();
</script>
